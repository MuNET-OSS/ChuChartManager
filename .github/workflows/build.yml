name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install and Build
      working-directory: ChuChartManager/Front
      run: |
        pnpm install
        pnpm build

    - name: Upload wwwroot
      uses: actions/upload-artifact@v4
      with:
        name: wwwroot
        path: ChuChartManager/wwwroot

  build-backend:
    name: Build Backend
    runs-on: windows-latest
    needs: build-frontend
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Download wwwroot
      uses: actions/download-artifact@v4
      with:
        name: wwwroot
        path: ChuChartManager/wwwroot

    - name: Publish
      run: |
        dotnet publish ChuChartManager/ChuChartManager.csproj -c Release -r win-x64 --self-contained -o publish /p:PublishSingleFile=false

    - name: Package
      shell: pwsh
      run: |
        Compress-Archive -Path publish/* -DestinationPath ChuChartManager-win-x64.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChuChartManager-win-x64
        path: ChuChartManager-win-x64.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-backend
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ChuChartManager-win-x64

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ChuChartManager-win-x64.zip
        generate_release_notes: true
        prerelease: true

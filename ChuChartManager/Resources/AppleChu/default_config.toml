## AppleChu 默认配置
## section 存在时启用，注释 section 时关闭

config_version = 1

## AM Daemon
[Amdaemon]
enable = true
## 由游戏侧启动 AM Daemon
AutoStart = false
## 可执行文件
Executable = "amdaemon.exe"
## 隐藏控制台窗口
HideWindow = false
## 退出时终止
TerminateOnExit = true
## 补充 JSON 参数
AppendConfigArgs = false
## AM Daemon JSON 配置文件列表
ConfigFiles = ["config_common.json", "config_server.json", "config_client.json", "config_cvt.json", "config_sp.json", "config_hook.json"]

## 机台序列号模拟
[PCBID]
enable = true
## 机台序列号
serialNo = "ACAE01A99999999"

## 虚拟文件系统
[VFS]
enable = true
## AMFS 目录
amfs = "amfs"
## APPDATA 目录
appdata = "appdata"
## 选项资源目录
option = "option"
## 允许写入 AMFS 下载内容
allowAmfsDownloads = false

## AM 平台 DNS 映射
[Dns]
enable = true
## 默认服务器
default = "localhost"
## 店内路由服务器
router = "localhost"
## 启动认证服务器
startup = "localhost"
## 计费服务器
billing = "localhost"
## AimeDB 服务器
aimedb = "localhost"
## 标题服务器
title = "title"
## 替换 HTTP Host
replaceHost = false
## 启动认证端口
startupPort = 0
## 计费端口
billingPort = 0
## AimeDB 端口
aimedbPort = 0

## NuSec/keychip 模拟
[Keychip]
enable = true
## Keychip ID
id = "A69E-01A88888888"
## 游戏 ID
gameId = "SDHD"
## 平台 ID
platformId = ""
## 区域编号
region = 1
## 计费类型
billingType = 1
## 系统标志
systemFlag = 100
## 店内网络子网
subnet = "192.168.139.0"
## 计费 CA 证书
billingCa = 'DEVICE\ca.crt'
## 计费公钥
billingPub = 'DEVICE\billing.pub'

## 店内网络适配器模拟
[NetEnv]
enable = true
## 机台 IP 末尾地址
addrSuffix = 11
## 路由 IP 末尾地址
routerSuffix = 254
## 虚拟网卡 MAC
macAddr = "01:02:03:04:05:06"
## UDP 广播地址
broadcast = "255.255.255.255"

## 系统设置
[System]
enable = true
## 开启控制台
EnableConsole = true
## 店内联机从机模式
LanSlave = false
## 机台模式
Mode = "SP"
## 刷新率
RefreshRate = 60

## 通用设置
[General]
enable = false
## 自定义版本号
version_text = ""

## 显示设置
[Window]
enable = true
## 窗口运行
windowed = false
## 显示窗口边框
framed = true
## 显示器编号
monitor = 0

## D3D9Ex 与设备丢失恢复
[D3D9Ex]
enable = false
## 设备丢失后自动恢复
device_lost_recover = true
## 快速重启补丁
fast_restart = true

## 跳过启动画面
[SkipStartup]
enable = false

## 免费游玩
[FreePlay]
enable = false
## 自定义显示文本
custom_text = ""

## 禁用选歌计时器
[DisableTimer]
enable = false

## 跳过地图动画
[SkipMapAnimation]
enable = false

## 解锁曲数上限
[UnlockTracks]
enable = false
## 最大曲数
max = 3

## 自定义计时器
[CustomTimers]
enable = false
## 地图选择
map_select = 60
## 票券选择
ticket_select = 60
## 课题选择
course_select = 60

## 自动游玩
[Autoplay]
## 只屏蔽成绩数据，角色/设置/地图进度正常保存
enable = false
## 切换键
hotkey = "Home"

## 解锁 120fps
[Unlock120fps]
enable = false

## 绕过 1080P 检测
[Bypass1080p]
enable = false

## 绕过 120Hz 检测
[Bypass120hz]
enable = false

## DPI 感知
[DpiAware]
enable = false

## 强制共享音频
[ForceSharedAudio]
## 系统采样率必须为 48000Hz，可能增加延迟
enable = false

## 强制双声道
[Force2chAudio]
enable = false

## 关闭网络加密
[DisableEncryption]
## 私服联网需要开启
enable = true

## 关闭 TLS
[DisableTLS]
enable = true

## 网络请求日志
[NetLog]
enable = false

## 全国对战 TCP 中继
[NationalMatch]
enable = false

## 绕过 AppUser 检测
[BypassAppUser]
enable = false

## FPS 显示
[FpsDisplay]
## 需要 d3d9 proxy
enable = false

## 帧率锁定
[FrameLock]
## 需要 d3d9 proxy
enable = false
## 目标帧率
fps = 60

## 控制器 IO DLL
[ChuniIo]
enable = true
## DLL 路径
path = ""
## 32 位 DLL 路径
path32 = ""
## 64 位 DLL 路径
path64 = ""

## 读卡器 IO DLL
[AimeIo]
enable = true
## DLL 路径
path = ""
## 32 位 DLL 路径
path32 = ""
## 64 位 DLL 路径
path64 = ""

## 按键输入
[Buttons]
enable = true
## Test 键
test = 112
## Service 键
service = 113
## 投币键
coin = 114
## AIR 模拟键
ir = 32

## AIR 输入
[Air]
enable = true
## AIR 1
air1 = 52
## AIR 2
air2 = 53
## AIR 3
air3 = 54
## AIR 4
air4 = 55
## AIR 5
air5 = 56
## AIR 6
air6 = 57

## 触摸条键位
[Slider]
enable = true
## Cell 1
cell1 = 76
## Cell 2
cell2 = 76
## Cell 3
cell3 = 76
## Cell 4
cell4 = 76
## Cell 5
cell5 = 75
## Cell 6
cell6 = 75
## Cell 7
cell7 = 75
## Cell 8
cell8 = 75
## Cell 9
cell9 = 74
## Cell 10
cell10 = 74
## Cell 11
cell11 = 74
## Cell 12
cell12 = 74
## Cell 13
cell13 = 72
## Cell 14
cell14 = 72
## Cell 15
cell15 = 72
## Cell 16
cell16 = 72
## Cell 17
cell17 = 71
## Cell 18
cell18 = 71
## Cell 19
cell19 = 71
## Cell 20
cell20 = 71
## Cell 21
cell21 = 70

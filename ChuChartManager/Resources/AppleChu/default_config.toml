cell32 = 83

## 灯光输出
[Led]
enable = true
## 机台灯光命名管道
cabLedOutputPipe = true
## 机台灯光串口
cabLedOutputSerial = false
## 控制器灯光命名管道
controllerLedOutputPipe = true
## 控制器灯光串口
controllerLedOutputSerial = false
## OpeNITHM 灯光格式
controllerLedOutputOpeNITHM = false
## 灯光串口
serialPort = "COM5"
## 串口波特率
serialBaud = 921600

## IO4 仿真
[Io4]
enable = true
## 仅前台读取输入
foreground = true

## Aime 读卡器
[Aime]
enable = true
## CVT 串口号
cvtPort = 4
## SP 串口号
spPort = 4
## 使用高波特率
highBaud = true
## Aime 文件
aimePath = 'DEVICE\aime.txt'
## FeliCa 文件
felicaPath = 'DEVICE\felica.txt'
## 认证数据文件
authdataPath = 'DEVICE\authdata.bin'
## 自动生成 Aime
aimeGen = true
## 自动生成 FeliCa
felicaGen = false
## 扫卡键
scan = 13
## 读卡器代数
gen = 0
## 读卡代理标志
proxyFlag = 2

## LED15093 灯板
[Led15093]
enable = true
## 第一块灯板串口
port0 = 0
## 第二块灯板串口
port1 = 0
## 控制板型号
boardNumber = "15093-06"
## 应用固件芯片
chipNumber = "6710 "
## 引导固件芯片
bootChipNumber = "6709 "
## 固件版本
fwVer = 144
## 固件校验和
fwSum = 44535
## 使用高波特率
highBaud = false

## VFD 显示板
[Vfd]
enable = true
## 串口号
portNo = 0
## 编码转换日志
utfConversion = false
